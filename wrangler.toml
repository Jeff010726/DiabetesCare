name = "diabetescare-api"
main = "worker/src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.xtdiabetescare.com/*", zone_name = "xtdiabetescare.com" },
  { pattern = "admin.xtdiabetescare.com/*", zone_name = "xtdiabetescare.com" }
]

[vars]
APP_ENV = "production"
APP_ORIGIN = "https://xtdiabetescare.com"
GOOGLE_SHEETS_SPREADSHEET_ID = "1qjOaxNH9zheEDNilwlzfLLzokqxvx8q93Fi2mBhHavI"

[[d1_databases]]
binding = "DB"
database_name = "diabetescare-db"
database_id = "38fec761-c97c-4c36-82dc-d98a1c9bcd8c"
migrations_dir = "worker/migrations"
