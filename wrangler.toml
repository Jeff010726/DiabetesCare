name = "diabetescare-api"
main = "worker/src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.xtdiabetescare.com/*", zone_name = "xtdiabetescare.com" },
  { pattern = "admin.xtdiabetescare.com/*", zone_name = "xtdiabetescare.com" }
]

[vars]
APP_ENV = "production"
APP_ORIGIN = "https://xtdiabetescare.com"
GOOGLE_SHEETS_SPREADSHEET_ID = "1qjOaxNH9zheEDNilwlzfLLzokqxvx8q93Fi2mBhHavI"
SMTP_HOST = "smtp.qq.com"
SMTP_PORT = "465"
SMTP_USER = "3359746636@qq.com"
SMTP_FROM = "3359746636@qq.com"
BOOKING_NOTIFY_TO = "xtdiabetescare@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "diabetescare-db"
database_id = "38fec761-c97c-4c36-82dc-d98a1c9bcd8c"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "INSURANCE_CARDS"
bucket_name = "xtdc-class-signup-insurance-cards"
