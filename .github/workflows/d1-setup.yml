name: Setup Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or find D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          list_json=$(npx wrangler d1 list --json)
          database_id=$(node -e "const dbs = JSON.parse(process.argv[1]); const db = dbs.find((item) => item.name === 'diabetescare-db'); if (db) process.stdout.write(db.uuid || db.id || '');" "$list_json")
          if [ -z "$database_id" ]; then
            output=$(npx wrangler d1 create diabetescare-db)
            echo "$output"
            database_id=$(echo "$output" | sed -n 's/.*database_id = \"\([^\"]*\)\".*/\1/p' | head -n 1)
          fi
          if [ -z "$database_id" ]; then
            echo "Could not determine D1 database_id" >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write D1 binding
        run: |
          node <<'NODE'
          const fs = require("fs");
          const databaseId = process.env.DATABASE_ID;
          const block = `[[d1_databases]]
          binding = "DB"
          database_name = "diabetescare-db"
          database_id = "${databaseId}"
          migrations_dir = "worker/migrations"`;
          let text = fs.readFileSync("wrangler.toml", "utf8");
          const commented = /# Add this block after creating the D1 database:\n# \[\[d1_databases\]\]\n# binding = "DB"\n# database_name = "diabetescare-db"\n# database_id = "<cloudflare-d1-database-id>"\n# migrations_dir = "worker\/migrations"/;
          const active = /\[\[d1_databases\]\]\n\s*binding = "DB"\n\s*database_name = "diabetescare-db"\n\s*database_id = "[^"]+"\n\s*migrations_dir = "worker\/migrations"/;
          if (active.test(text)) {
            text = text.replace(active, block);
          } else if (commented.test(text)) {
            text = text.replace(commented, block);
          } else {
            text += `\n\n${block}\n`;
          }
          fs.writeFileSync("wrangler.toml", text);
          NODE
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}

      - name: Commit D1 binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git diff --cached --quiet || git commit -m "Configure D1 database binding"
          git push
