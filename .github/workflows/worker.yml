name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - 0518
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Sheets service account email
        run: |
          if [ -z "$GOOGLE_SHEETS_CLIENT_EMAIL" ]; then
            echo "GOOGLE_SHEETS_CLIENT_EMAIL is not configured; skipping."
            exit 0
          fi
          printf '%s' "$GOOGLE_SHEETS_CLIENT_EMAIL" | npx wrangler secret put GOOGLE_SHEETS_CLIENT_EMAIL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}

      - name: Sync Google Sheets private key
        run: |
          if [ -z "$GOOGLE_SHEETS_PRIVATE_KEY" ]; then
            echo "GOOGLE_SHEETS_PRIVATE_KEY is not configured; skipping."
            exit 0
          fi
          printf '%s' "$GOOGLE_SHEETS_PRIVATE_KEY" | npx wrangler secret put GOOGLE_SHEETS_PRIVATE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}

      - name: Sync admin email
        run: |
          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ADMIN_EMAIL is not configured; skipping."
            exit 0
          fi
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      - name: Sync admin password
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_PASSWORD is not configured; skipping."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Sync SMTP host
        run: |
          if [ -z "$SMTP_HOST" ]; then
            echo "SMTP_HOST is not configured; skipping."
            exit 0
          fi
          printf '%s' "$SMTP_HOST" | npx wrangler secret put SMTP_HOST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}

      - name: Sync SMTP port
        run: |
          if [ -z "$SMTP_PORT" ]; then
            echo "SMTP_PORT is not configured; skipping."
            exit 0
          fi
          printf '%s' "$SMTP_PORT" | npx wrangler secret put SMTP_PORT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Sync SMTP user
        run: |
          if [ -z "$SMTP_USER" ]; then
            echo "SMTP_USER is not configured; skipping."
            exit 0
          fi
          printf '%s' "$SMTP_USER" | npx wrangler secret put SMTP_USER
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}

      - name: Sync SMTP password
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP_PASSWORD is not configured; skipping."
            exit 0
          fi
          printf '%s' "$SMTP_PASSWORD" | npx wrangler secret put SMTP_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Sync booking notification recipient
        run: |
          if [ -z "$BOOKING_NOTIFY_TO" ]; then
            echo "BOOKING_NOTIFY_TO is not configured; skipping."
            exit 0
          fi
          printf '%s' "$BOOKING_NOTIFY_TO" | npx wrangler secret put BOOKING_NOTIFY_TO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_NOTIFY_TO: ${{ secrets.BOOKING_NOTIFY_TO }}

      - name: Sync SMTP from
        run: |
          if [ -z "$SMTP_FROM" ]; then
            echo "SMTP_FROM is not configured; skipping."
            exit 0
          fi
          printf '%s' "$SMTP_FROM" | npx wrangler secret put SMTP_FROM
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

      - name: Ensure private insurance card bucket
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2
            exit 1
          fi
          list_json=$(npx wrangler r2 bucket list --json)
          bucket_exists=$(node -e "const buckets = JSON.parse(process.argv[1]); process.stdout.write(buckets.some((bucket) => bucket.name === 'xtdc-class-signup-insurance-cards') ? 'true' : 'false');" "$list_json")
          if [ "$bucket_exists" = "true" ]; then
            echo "Private insurance card bucket already exists."
          else
            npx wrangler r2 bucket create xtdc-class-signup-insurance-cards
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: |
          if grep -q 'database_id = "<cloudflare-d1-database-id>"' wrangler.toml || ! grep -q '\[\[d1_databases\]\]' wrangler.toml; then
            echo "D1 binding is not configured yet; skipping migrations."
            exit 0
          fi
          npx wrangler d1 migrations apply diabetescare-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
